<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#18161e">
<title>$GODOT_PROJECT_NAME</title>
<!-- Страница браузерной Godot-версии «Колёс и Костей» (пресет export_presets.cfg → html/custom_html_shell).
     Собирает godot/tools/build_web.py: он же переименовывает файлы движка и пакета с меткой версии (против кеша)
     и правит GODOT_CONFIG. Помощники для игры (window.wnb*) — ниже, их зовёт autoload/web.gd через JavaScriptBridge. -->
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; background: #18161e; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
/* холст: размер ведёт страница (wnbView ниже), в левом верхнем углу, документ не раздвигает */
#canvas { display: block; position: fixed; left: 0; top: 0; width: 100px; height: 100px; }
#canvas:focus { outline: none; }
/* мерка видимого окна по раскладке CSS (не по window.innerWidth/innerHeight) */
#wnb-vp { position: fixed; left: 0; top: 0; right: 0; bottom: 0; visibility: hidden; pointer-events: none; z-index: -1; }
/* ?fps=1: строка размеров страницы (#wnb-diag) и плашка кадров/с (#wnb-hud) — места ставит wnbMeasure ниже:
   в чёрных полях по бокам игры, если они есть; иначе — в полях сверху/снизу; иначе узкой полосой у нижнего края
   картинки (там на всех экранах нет кнопок). Касания проходят сквозь (pointer-events: none). */
#wnb-diag, #wnb-hud { position: fixed; z-index: 10001; pointer-events: none; box-sizing: border-box; padding: 1px 3px;
  background: rgba(0,0,0,.5); color: #fff; font: 10px/1.15 Consolas, "DejaVu Sans Mono", monospace;
  white-space: pre-wrap; overflow: hidden; word-break: break-word; }
#wnb-load { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; padding-bottom: 8vh; box-sizing: border-box; color: #f0b85a; transition: opacity .6s;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(10,8,14,.75) 100%), #1d1b24 url(splash.jpg) center / cover no-repeat; }
#wnb-load .t { font: bold clamp(30px, 6vw, 60px) Georgia, "Times New Roman", serif; letter-spacing: 2px;
  text-shadow: 0 2px 16px #000, 0 0 3px #000; margin-bottom: 10px; }
#wnb-load progress { width: min(460px, 80vw); height: 14px; accent-color: #e8a33d; }
#wnb-load .m { font: bold 15px sans-serif; color: #ece6d4; text-shadow: 0 1px 6px #000; margin-top: 10px; min-height: 20px;
  text-align: center; padding: 0 16px; }
#wnb-load .e { display: none; max-width: 640px; margin: 12px 16px 0; padding: 12px; border-radius: 8px;
  background: #5b3943; border: 1px solid #9b3943; color: #eee; font: 14px sans-serif; text-align: center; }
#wnb-field { position: fixed; z-index: 5; display: none; box-sizing: border-box; margin: 0; border: 0; outline: none;
  background: transparent; color: #f2f2f2; caret-color: #7fe3ff; font-family: "DejaVu Sans", Verdana, sans-serif;
  padding: 0 10px; -webkit-user-select: text; user-select: text; touch-action: auto; }
#wnb-field::placeholder { color: #6a6a78; }
#wnb-live { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
html, body, #canvas { overscroll-behavior: none; }
#canvas { touch-action: none; }
/* заслонка «поверни телефон боком» (как game.py web_setup_touch): поверх заставки загрузки и игры */
#wnb-rotate { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center;
  justify-content: center; background: #1d1b24; color: #f0b85a; font: bold 22px sans-serif; text-align: center;
  padding: 24px; box-sizing: border-box; touch-action: none; }
#wnb-rotate .i { font-size: 72px; line-height: 1; }
#wnb-rotate .m { margin-top: 12px; }
#wnb-portrait { margin-top: 28px; min-height: 48px; padding: 10px 22px; border: 2px solid #f0b85a; border-radius: 10px;
  background: transparent; color: #f0b85a; font: bold 18px sans-serif; cursor: pointer; }
#wnb-full, #wnb-exitfs { position: fixed; z-index: 9998; border: 0; padding: 0; border-radius: 10px; color: #fff;
  background: rgba(0,0,0,.45); opacity: .6; cursor: pointer; }
#wnb-full, #wnb-exitfs.touch { left: 6px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
  font: bold 20px sans-serif; }
#wnb-exitfs { display: none; }
#wnb-exitfs:not(.touch) { left: 50%; bottom: 4px; transform: translateX(-50%); padding: 5px 12px; border-radius: 8px;
  background: rgba(0,0,0,.55); font: bold 13px sans-serif; opacity: .85; }
@media (max-height: 480px) { #wnb-load { padding-bottom: 3vh; } #wnb-load .t { margin-bottom: 4px; } }
</style>
<script>
// Помощники для игры. Всё, что игра зовёт из GDScript (autoload/web.gd, frames.gd, audio.gd, share_dialog.gd).
(function () {
  'use strict';
  // --- сеть: кадры поворота и петли (frames/…), музыка — файлами рядом с игрой. fetch в браузере идёт параллельно
  // и мимо игрового кадра; игра раз в кадр забирает готовое (next/take), декодирует WebP сама.
  var net = { want: [], active: 0, max: 6, done: [], bufs: {}, dims: {}, ok: 0, fail: 0, bytes: 0, dec: 0, decMs: 0,
              worker: null, mode: 'worker' };
  // Кадры (WebP) распаковывает фоновый поток страницы (Worker): createImageBitmap → WebGL2 → readPixels даёт
  // RGBA как есть (без домножения на прозрачность — цвет под прозрачными пикселями не теряется, как при чтении через
  // 2D-холст). Игре остаётся скопировать готовые пиксели и построить mipmaps — в игровом кадре втрое-вчетверо меньше
  // работы, чем распаковка WebP в WebAssembly. Нет Worker/OffscreenCanvas/WebGL2 — игра распаковывает сама (сырые байты).
  function workerSrc() {
    var gl = null;
    function viaGL(bmp) {
      if (gl === null) {
        try { gl = new OffscreenCanvas(1, 1).getContext('webgl2', { premultipliedAlpha: false, antialias: false }) || false; }
        catch (e) { gl = false; }
      }
      if (!gl) return null;
      var w = bmp.width, h = bmp.height, tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, bmp);
      var fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      var px = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.deleteFramebuffer(fb);
      gl.deleteTexture(tex);
      return px;
    }
    onmessage = function (e) {
      var d = e.data, t0 = performance.now();
      createImageBitmap(new Blob([d.buf]), { premultiplyAlpha: 'none', colorSpaceConversion: 'none' }).then(function (bmp) {
        var px = viaGL(bmp), w = bmp.width, h = bmp.height;
        bmp.close();
        if (!px) throw new Error('no webgl2');
        postMessage({ u: d.u, w: w, h: h, px: px.buffer, ms: performance.now() - t0 }, [px.buffer]);
      }).catch(function () {
        postMessage({ u: d.u, w: 0, h: 0, px: d.buf, ms: 0, raw: true }, [d.buf]);
      });
    };
  }
  try {
    if (window.Worker && window.OffscreenCanvas && window.createImageBitmap && !/[?&]decode=godot/.test(location.search)) {
      net.worker = new Worker(URL.createObjectURL(new Blob(['(' + workerSrc + ')()'], { type: 'text/javascript' })));
      net.worker.onmessage = function (e) {
        var m = e.data;
        net.bufs[m.u] = m.px;
        if (m.w > 0) { net.dims[m.u] = m.w + ',' + m.h; net.dec++; net.decMs += m.ms; }
        else if (m.raw) net.mode = 'godot';        // фоновая распаковка не вышла — дальше игра распаковывает сама
        net.done.push(m.u);
      };
      net.worker.onerror = function () { net.worker = null; net.mode = 'godot'; };
    } else net.mode = 'godot';
  } catch (e) { net.worker = null; net.mode = 'godot'; }
  function pump() {
    while (net.active < net.max && net.want.length) {
      var u = net.want.shift();
      net.active++;
      fetch(u).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      }).then(function (b) {
        net.ok++; net.bytes += b.byteLength;
        if (net.worker && net.mode === 'worker' && /\.webp(\?|$)/.test(this)) {
          net.worker.postMessage({ u: this, buf: b }, [b]);
        } else {
          net.bufs[this] = b; net.done.push(this);
        }
      }.bind(u), function () {
        net.bufs[this] = null; net.fail++; net.done.push(this);
      }.bind(u)).then(function () { net.active--; pump(); });
    }
  }
  window.wnbNet = {
    get: function (u) { net.want.push(u); pump(); },
    // готовые адреса через \n (за один вызов из игры), пусто — ничего нового
    next: function () { var d = net.done; net.done = []; return d.join('\n'); },
    // "ш,в" — пиксели RGBA уже распакованы фоновым потоком; "" — сырые байты файла (распаковывает игра)
    dims: function (u) { return net.dims[u] || ''; },
    take: function (u) { var b = net.bufs[u]; delete net.bufs[u]; delete net.dims[u]; return b ? new Uint8Array(b) : null; },
    drop: function (prefix) { net.want = net.want.filter(function (u) { return u.indexOf(prefix) !== 0; }); },
    // проверка (web_smoke): распаковать файл тем же фоновым способом → {w, h, b64} (RGBA в base64)
    probe: function (u) {
      return fetch(u).then(function (r) { return r.arrayBuffer(); }).then(function (b) {
        return new Promise(function (res) {
          var w = new Worker(URL.createObjectURL(new Blob(['(' + workerSrc + ')()'], { type: 'text/javascript' })));
          w.onmessage = function (e) {
            w.terminate();
            var a = new Uint8Array(e.data.px), s = '';
            for (var i = 0; i < a.length; i += 32768) s += String.fromCharCode.apply(null, a.subarray(i, i + 32768));
            res({ w: e.data.w, h: e.data.h, b64: btoa(s) });
          };
          w.postMessage({ u: u, buf: b }, [b]);
        });
      });
    },
    stats: function () {
      return JSON.stringify({ ok: net.ok, fail: net.fail, bytes: net.bytes, active: net.active, queued: net.want.length,
        mode: net.mode, worker_decoded: net.dec, worker_ms: net.dec ? +(net.decMs / net.dec).toFixed(2) : 0 });
    }
  };

  // --- музыка: элемент <audio> страницы. Браузер сам качает и декодирует поток (не в игровом кадре, без треска в
  // однопоточной сборке и без распаковки всей темы в память, как сделал бы режим Sample). Играть можно только после
  // жеста игрока: при каждом нажатии/клавише пробуем запустить, если игра хочет музыку.
  var mus = { a: null, src: '', want: false, vol: 1 };
  function el() {
    if (!mus.a) { mus.a = new Audio(); mus.a.loop = true; mus.a.preload = 'auto'; }
    return mus.a;
  }
  function tryPlay() {
    if (mus.want && mus.a && mus.a.paused && !document.hidden) {
      var p = mus.a.play();
      if (p && p.catch) p.catch(function () {});
    }
  }
  ['pointerdown', 'keydown', 'touchend', 'mousedown'].forEach(function (e) { document.addEventListener(e, tryPlay, true); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (mus.a) mus.a.pause(); } else tryPlay();
  });
  window.wnbMusic = {
    play: function (u) { var a = el(); if (mus.src !== u) { mus.src = u; a.src = u; } mus.want = true; tryPlay(); },
    stop: function () { mus.want = false; if (mus.a) mus.a.pause(); },
    volume: function (v) { el().volume = Math.max(0, Math.min(1, v)); },
    state: function () { return mus.a ? ((mus.a.paused ? 'paused' : 'playing') + ' ' + mus.src) : 'none'; }
  };

  // --- поле ввода кода поверх холста (окно «Вставить код» и имя в конструкторе ссылки): настоящее <input>, чтобы на
  // телефоне появлялась экранная клавиатура и работала вставка долгим нажатием. Игра рисует рамку, текст — здесь.
  var fld = { el: null, enter: 0, esc: 0, key: '', at: null };
  // координаты игры (пиксели буфера холста) → CSS страницы; зовётся и при смене размера холста (wnbView)
  function place() {
    var f = fld.el, a = fld.at;
    if (!f || !a || f.style.display === 'none') return;
    var c = document.getElementById('canvas'), r = c.getBoundingClientRect();
    var kx = r.width / (c.width || 1), ky = r.height / (c.height || 1);
    f.style.left = (r.left + a[0] * kx) + 'px'; f.style.top = (r.top + a[1] * ky) + 'px';
    f.style.width = (a[2] * kx) + 'px'; f.style.height = (a[3] * ky) + 'px';
    f.style.fontSize = Math.max(12, a[4] * ky) + 'px';
  }
  window.wnbField = {
    relayout: place,
    show: function (key, x, y, w, h, value, maxLen, ph, fontPx) {
      var f = fld.el;
      if (!f) {
        f = fld.el = document.createElement('input');
        f.id = 'wnb-field'; f.type = 'text'; f.autocomplete = 'off'; f.spellcheck = false;
        f.setAttribute('autocapitalize', 'off'); f.setAttribute('autocorrect', 'off');
        f.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { fld.enter++; e.preventDefault(); }
          else if (e.key === 'Escape') { fld.esc++; e.preventDefault(); }
          e.stopPropagation();
        });
        f.addEventListener('keyup', function (e) { e.stopPropagation(); });
        document.body.appendChild(f);
      }
      fld.at = [x, y, w, h, fontPx];
      f.maxLength = maxLen; f.placeholder = ph || '';
      f.setAttribute('aria-label', ph || key);
      if (fld.key !== key) f.style.display = 'block';
      place();
      if (fld.key !== key) {
        fld.key = key; f.value = value || ''; fld.enter = 0; fld.esc = 0;
        var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
        if (!coarse) setTimeout(function () { f.focus(); }, 0);   // на телефоне клавиатуру открывает касание
      }
    },
    hide: function () {
      if (fld.el) { fld.el.style.display = 'none'; fld.el.blur(); }
      fld.key = '';
      var c = document.getElementById('canvas'); if (c) c.focus();
    },
    // значение и счётчики Enter/Esc одним вызовом: JSON
    poll: function () {
      var r = JSON.stringify({ v: fld.el ? fld.el.value : '', enter: fld.enter, esc: fld.esc });
      fld.enter = 0; fld.esc = 0;
      return r;
    },
    set: function (v) { if (fld.el) fld.el.value = v; }
  };

  // --- язык страницы (заслонка, кнопки, заставка): до загрузки игры — последний язык игры (localStorage) или язык
  // браузера (ru → русский, иначе английский); игра сообщает свой через wnbLang(code) (autoload/web.gd).
  var TXT = {
    ru: { phone: 'Поверни телефон боком, чтобы играть', dev: 'Поверни планшет боком, чтобы играть',
          anyway: 'Играть так (книжная ориентация)', full: 'Полный экран', exit: 'Выйти из полного экрана',
          exitEsc: '\u2716 Выйти из полного экрана (Esc)', f11: 'Нажми F11 (или Esc), чтобы выйти из полного экрана',
          load: 'Загружаю мастерскую…', start: 'Запуск…', fail: 'Игра не запустилась.' },
    en: { phone: 'Turn your phone sideways to play', dev: 'Turn your device sideways to play',
          anyway: 'Play in portrait anyway', full: 'Fullscreen', exit: 'Exit fullscreen',
          exitEsc: '\u2716 Exit fullscreen (Esc)', f11: 'Press F11 (or Esc) to leave full screen',
          load: 'Loading the workshop…', start: 'Starting…', fail: 'The game could not start.' }
  };
  var lang = '';
  try { lang = localStorage.getItem('wnb-godot:lang') || ''; } catch (e) { lang = ''; }
  if (!TXT[lang]) lang = /^ru\b/i.test(navigator.language || '') ? 'ru' : 'en';
  var langCbs = [];
  window.wnbT = function (k) { return TXT[lang][k] || TXT.en[k] || k; };
  window.wnbOnLang = function (f) { langCbs.push(f); f(); };
  window.wnbLang = function (code) {
    if (!TXT[code]) return;
    try { localStorage.setItem('wnb-godot:lang', code); } catch (e) {}
    if (code === lang) return;
    lang = code;
    document.documentElement.lang = code;
    langCbs.forEach(function (f) { try { f(); } catch (e) {} });
  };
  window.wnbLangNow = function () { return lang; };
  document.documentElement.lang = lang;

  // --- потолок разрешения холста: ?res=N — высота игровой картинки 16:9 в пикселях холста (0 — без потолка).
  // Буфер холста = CSS-размер × effDpr() (считает wnbView ниже: политика холста 0, Godot размер не трогает); если
  // картинка выходит выше потолка, effDpr меньше настоящего, CSS-размер тот же, браузер растягивает. По умолчанию —
  // RES_DEFAULT и не ниже 1 (только убирает лишнее на экранах с большой плотностью); с ?res= — как задано.
  // window.devicePixelRatio подменён тем же effDpr — чтобы и Godot (screen_get_scale) видел тот же масштаб.
  var RES_DEFAULT = 1080;
  var qr = /[?&]res=(\d+)/.exec(location.search);
  var res = qr ? +qr[1] : RES_DEFAULT;
  var dprDesc = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
                Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
  function realDpr() { try { return (dprDesc && dprDesc.get ? dprDesc.get.call(window) : 1) || 1; } catch (e) { return 1; } }
  // размер видимого окна — из wnbView (мерка по раскладке CSS); до её появления — innerWidth/innerHeight
  function viewCss() { return window.wnbView ? window.wnbView.size() : [window.innerWidth, window.innerHeight]; }
  function gameCssH() { var v = viewCss(); return Math.max(1, Math.min(v[1], v[0] * 9 / 16)); }
  function effDpr() {
    var d = realDpr();
    if (res > 0 && gameCssH() * d > res) d = Math.max(qr ? 0.25 : 1, Math.min(d, res / gameCssH()));
    return d;
  }
  try {
    if (dprDesc && dprDesc.get && res > 0) Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: effDpr });
  } catch (e) {}
  window.wnbRes = {
    cap: res, real: realDpr, eff: effDpr,
    dpr: function () {
      var r = realDpr(), e = effDpr();
      return 'dpr ' + (+r.toFixed(2)) + (Math.abs(e - r) > 0.001 ? '→' + (+e.toFixed(2)) + ' (res ' + res + ')' : '');
    },
    line: function () {
      var r = realDpr(), e = effDpr();
      return 'css ' + window.innerWidth + '\u00d7' + window.innerHeight + ' dpr ' + (+r.toFixed(2)) +
        (Math.abs(e - r) > 0.001 ? '\u2192' + (+e.toFixed(2)) + ' (res ' + res + ')' : '');
    }
  };

  // --- время загрузки: игра отмечает первый кадр титула (wnbMark('title')), страница — начало загрузки.
  window.wnbTimes = { start: performance.now() };
  window.wnbMark = function (k) { if (!(k in window.wnbTimes)) window.wnbTimes[k] = performance.now(); };
})();
</script>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<div id="wnb-vp" aria-hidden="true"></div>
<noscript>Your browser does not support JavaScript.</noscript>
<script>
// Размер холста ведёт страница (пресет: html/canvas_resize_policy=0 — Godot берёт окно = canvas.width × canvas.height
// и сам их не меняет). Раньше (политика 2) движок брал размер из window.innerWidth/innerHeight, а на телефоне после
// полного экрана и поворота (Huawei Mate 20 Pro, Chrome) innerHeight оставался книжным (780 при 780×360): окно Godot
// 780×780, картинка 16:9 уезжала вниз на 170 px. Теперь видимый размер — по раскладке CSS (#wnb-vp: position fixed,
// inset 0), не больше visualViewport (кроме времени набора в поле — экранная клавиатура) и, на сенсорном экране, не
// больше экрана (screen.width/height: короткая/длинная сторона по ориентации). Пересчёт — по событиям окна, экрана,
// полного экрана, ResizeObserver, раз в 0,5 с и очередью попыток в течение 1,5 с после поворота/полного экрана.
(function () {
  'use strict';
  var c = document.getElementById('canvas'), probe = document.getElementById('wnb-vp');
  var touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var cur = { w: 0, h: 0 };
  function orientName() {
    var o = screen.orientation && screen.orientation.type;
    if (o) return o;
    if (typeof window.orientation === 'number') return Math.abs(window.orientation) === 90 ? 'landscape' : 'portrait';
    return '';
  }
  function typing() { var a = document.activeElement; return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'); }
  function measure() {
    var r = probe.getBoundingClientRect(), w = r.width, h = r.height;
    if (!(w > 0 && h > 0)) {
      var de = document.documentElement;
      w = de.clientWidth || window.innerWidth; h = de.clientHeight || window.innerHeight;
    }
    var vv = window.visualViewport;
    if (vv && vv.width > 0 && vv.height > 0 && !typing()) { w = Math.min(w, vv.width); h = Math.min(h, vv.height); }
    var sw = screen.width, sh = screen.height;
    if (touch && sw > 0 && sh > 0) {
      var lo = Math.min(sw, sh), hi = Math.max(sw, sh), o = orientName();
      var land = o ? o.indexOf('landscape') === 0 : w > h;
      if (land) { w = Math.min(w, hi); h = Math.min(h, lo); } else { w = Math.min(w, lo); h = Math.min(h, hi); }
    }
    return [Math.max(1, Math.floor(w)), Math.max(1, Math.floor(h))];
  }
  function fit() {
    var m = measure();
    cur.w = m[0]; cur.h = m[1];
    var d = window.wnbRes ? window.wnbRes.eff() : (window.devicePixelRatio || 1);
    var bw = Math.max(1, Math.round(m[0] * d)), bh = Math.max(1, Math.round(m[1] * d));
    var sw = m[0] + 'px', sh = m[1] + 'px', changed = false;
    if (c.style.width !== sw || c.style.height !== sh) { c.style.width = sw; c.style.height = sh; changed = true; }
    if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; changed = true; }   // Godot подхватит в кадре
    if (changed && window.wnbField && window.wnbField.relayout) window.wnbField.relayout();
    if (diag) diagLine();
    return changed;
  }
  var burstT = [];
  function burst() {               // размеры на Android приходят с опозданием и по одному — проверить ещё несколько раз
    burstT.forEach(clearTimeout);
    burstT = [0, 60, 150, 300, 500, 750, 1000, 1500].map(function (t) { return setTimeout(fit, t); });
  }
  // ?fps=1 — замер для владельца: строка размеров страницы (diag) и кадры/с от игры (hud, wnbHud из autoload/web.gd).
  // Обе — в чёрных полях по бокам игры 16:9 (телефон 19,5:9, широкое окно), по полю на каждую; без боковых полей — в
  // полях сверху/снизу; без полей вовсе — узкой полосой у нижнего края картинки (ниже кнопок «НАЗАД» и т. п.).
  var diag = null, hud = null, hudParts = [];
  if (/[?&]fps(=(?!(0|no|off|false)(&|#|$))[^&#]*)?(&|#|$)/i.test(location.search)) {   // как Web.flag("fps")
    diag = document.createElement('div'); diag.id = 'wnb-diag'; diag.setAttribute('aria-hidden', 'true');
    hud = document.createElement('div'); hud.id = 'wnb-hud'; hud.setAttribute('aria-hidden', 'true');
    document.body.appendChild(diag); document.body.appendChild(hud);
  }
  function fsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function parts() {
    var vv = window.visualViewport, g = window.wnbGodotSize || '?';
    return ['inner ' + window.innerWidth + '×' + window.innerHeight,
      'vv ' + (vv ? Math.round(vv.width) + '×' + Math.round(vv.height) : '-'),
      'screen ' + screen.width + '×' + screen.height, 'css ' + cur.w + '×' + cur.h, 'buf ' + c.width + '×' + c.height,
      'godot ' + g, 'fs ' + (fsOn() ? 1 : 0), (orientName() || '-').replace('-primary', '').replace('-secondary', '-2')];
  }
  function line() { return parts().join(' · '); }
  function put(el, t, st) {
    var k, all = { left: '', right: '', top: '', bottom: '', width: '', maxHeight: '', textAlign: 'left', transform: '',
      fontSize: '' };
    for (k in st) all[k] = st[k];
    for (k in all) if (el.style[k] !== all[k]) el.style[k] = all[k];
    if (el.textContent !== t) el.textContent = t;
  }
  function diagLine() {
    if (!diag) return;
    var W = cur.w, H = cur.h, s = Math.min(W / 1280, H / 720);
    var gx = Math.floor((W - 1280 * s) / 2), gy = Math.floor((H - 720 * s) / 2);
    var dp = parts(), hp = hudParts.slice();
    if (window.wnbRes && wnbRes.dpr) hp.push(wnbRes.dpr());
    var mode;
    if (gx >= 40) {               // поля по бокам: справа размеры, слева под кнопкой ⛶ (она по центру) — кадры/с
      mode = 'side';             // узкое поле (телефон 19,5:9 — 50 px): мельче, чтобы «2220×1080» влезло в строку
      var fz = Math.max(8, Math.min(10, (gx - 6) / 5.6)).toFixed(1) + 'px';
      put(diag, dp.join('\n'), { right: '0px', top: '0px', width: gx + 'px', maxHeight: '100%', fontSize: fz });
      put(hud, hp.join('\n'), { left: '0px', bottom: '0px', width: gx + 'px', maxHeight: 'calc(50% - 26px)',
        fontSize: fz });
    } else if (gy >= 26) {        // поля сверху и снизу (книжная, 4:3)
      mode = 'tb';
      put(diag, dp.join(' · '), { left: '0px', right: '0px', top: '0px', maxHeight: gy + 'px', textAlign: 'center' });
      put(hud, hp.join(' · '), { left: '0px', right: '0px', bottom: '0px', maxHeight: gy + 'px', textAlign: 'center' });
    } else {                      // полей нет: у нижнего края картинки, слева кадры/с, справа размеры (до 2 строк)
      mode = 'strip';
      var w = Math.floor((W - 2 * Math.max(0, gx)) * 0.4) + 'px', b = (Math.max(0, gy) + Math.round(720 * s)) + 'px';
      var up = 'translateY(-100%)';
      put(hud, hp.join(' · '), { left: Math.max(0, gx) + 'px', top: b, transform: up, width: w, maxHeight: '2.6em' });
      put(diag, dp.join(' · '), { left: (W - Math.max(0, gx) - parseInt(w, 10)) + 'px', top: b, transform: up, width: w,
        maxHeight: '2.6em', textAlign: 'right' });
    }
    if (diag.getAttribute('data-mode') !== mode) { diag.setAttribute('data-mode', mode); hud.setAttribute('data-mode', mode); }
  }
  window.wnbHud = function (p) { hudParts = p || []; diagLine(); };
  window.wnbView = { size: function () { return cur.w > 0 ? [cur.w, cur.h] : measure(); }, fit: fit, burst: burst, line: line };

  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', burst);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', burst);
  document.addEventListener('fullscreenchange', burst); document.addEventListener('webkitfullscreenchange', burst);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(probe);
  document.addEventListener('focusout', function () { setTimeout(fit, 0); });   // поле кода закрыто — снова по vv
  setInterval(fit, 500);
})();
</script>
<div id="wnb-live" aria-live="assertive" role="status"></div>
<div id="wnb-load">
  <div class="t">Wheels &amp; Bones</div>
  <progress id="wnb-bar"></progress>
  <div class="m" id="wnb-msg"></div>
  <div class="e" id="wnb-err"></div>
</div>
<script>
// Сенсорный экран (как web_setup_touch в game.py): на телефоне в книжной ориентации — заслонка «поверни боком»
// (планшет — с кнопкой «играть так»), по первому касанию на телефоне — полный экран и альбомная ориентация; кнопка
// полного экрана ⛶/✖ у левого края; на компьютере — «✖ Выйти из полного экрана (Esc)» внизу при полном экране.
// Пока заслонка видна, игра на паузе и не рисует кадры (wnbOnCover → autoload/web.gd). Работает и во время загрузки.
(function () {
  'use strict';
  var T = window.wnbT;
  var de = document.documentElement;
  var touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var isFs = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
  var canFs = !!(de.requestFullscreen || de.webkitRequestFullscreen);
  var inFrame = false; try { inFrame = window.parent !== window; } catch (e) { inFrame = true; }
  var cover = { on: false, cbs: [] };
  window.wnbCover = function () { return cover.on; };
  window.wnbOnCover = function (cb) { cover.cbs.push(cb); try { cb(cover.on); } catch (e) {} };
  function setCover(v) {
    if (v === cover.on) return;
    cover.on = v;
    cover.cbs.forEach(function (cb) { try { cb(v); } catch (e) {} });
    if (!v && window.wnbView) window.wnbView.burst();          // игра снова видна — размер холста перепроверить
  }
  function full() {
    var f = de.requestFullscreen || de.webkitRequestFullscreen;
    if (isFs() || !f) return;
    try {
      var p = f.call(de);
      if (p && p.then) p.then(function () {
        if (window.wnbView) window.wnbView.burst();
        try {
          var l = screen.orientation.lock('landscape');
          if (l && l.then) l.then(function () { if (window.wnbView) window.wnbView.burst(); }, function () {});
        } catch (e) {}
      }).catch(function () {});
    } catch (e) {}
  }
  function exitFs() { var ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); }

  // выход из полного экрана: компьютер — надпись внизу (и при F11); сенсорный — ✖ слева, если нет кнопки ⛶
  if (document.exitFullscreen || document.webkitExitFullscreen) {
    var x = document.createElement('button'); x.id = 'wnb-exitfs'; x.type = 'button';
    if (touch) x.className = 'touch';
    var big = function () { return !touch && innerWidth >= screen.width - 2 && innerHeight >= screen.height - 2; };
    x.onclick = function () {
      if (isFs()) { exitFs(); return; }
      if (inFrame) { try { window.parent.postMessage({ wnb: 'exitfs' }, '*'); } catch (e) {} }   // сайт развернул iframe
      if (touch) return;
      x.textContent = T('f11');                                   // F11 браузера скриптом не снять
      setTimeout(function () { x.textContent = T('exitEsc'); }, 4000);
    };
    document.body.appendChild(x);
    // во фрейме сайта своя кнопка у обёртки — наша только при полном экране самого документа
    var fsShow = function () {
      x.style.display = (touch ? (isFs() && !document.getElementById('wnb-full'))
                               : (isFs() || (!inFrame && big()))) ? 'block' : 'none';
    };
    document.addEventListener('fullscreenchange', fsShow); document.addEventListener('webkitfullscreenchange', fsShow);
    window.addEventListener('resize', fsShow); setInterval(fsShow, 1000); fsShow();
    window.wnbOnLang(function () {
      x.textContent = touch ? '\u2716' : T('exitEsc');
      x.setAttribute('aria-label', T('exit'));
    });
  }
  if (!touch) return;

  var phone = Math.min(screen.width, screen.height) < 700;
  var ov = document.createElement('div'); ov.id = 'wnb-rotate';
  ov.innerHTML = '<div class="i" aria-hidden="true">&#x21BB;</div><div class="m" role="alert"></div>';
  var pa = null, anyway = false;                 // планшет: «играть так» — до перезагрузки страницы
  if (!phone) {
    pa = document.createElement('button'); pa.id = 'wnb-portrait'; pa.type = 'button';
    pa.onclick = function (e) { anyway = true; chk(); if (e) e.stopPropagation(); };
    ov.appendChild(pa);
  }
  // касания по заслонке игре не достаются (кроме кнопки «играть так»)
  ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'mouseup'].forEach(function (n) {
    ov.addEventListener(n, function (e) {
      if (pa && (e.target === pa)) return;
      e.stopPropagation();
      if (e.cancelable) e.preventDefault();
    });
  });
  document.body.appendChild(ov);
  // телефон — пока экран в книжной ориентации; планшет (любое сенсорное не-«телефон») — пока окно выше, чем шире
  function chk() {
    var show = phone ? (screen.height > screen.width && innerHeight > innerWidth * 0.9) : (!anyway && innerHeight > innerWidth);
    ov.style.display = show ? 'flex' : 'none';
    setCover(show);
  }
  window.addEventListener('resize', chk); window.addEventListener('orientationchange', chk);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', chk);
  chk();
  if (phone) window.addEventListener('touchend', full, { once: true, capture: true });

  var b = null;
  if (canFs) {
    b = document.createElement('button'); b.id = 'wnb-full'; b.type = 'button';   // у левого края по центру
    b.onclick = function () { if (isFs()) exitFs(); else full(); };
    document.body.appendChild(b);
  }
  function texts() {
    ov.querySelector('.m').textContent = T(phone ? 'phone' : 'dev');
    if (pa) pa.textContent = T('anyway');
    if (b) {
      var on = isFs();                            // одна кнопка: вход ⛶ / выход ✖
      b.textContent = on ? '\u2716' : '\u26F6';
      b.setAttribute('aria-label', T(on ? 'exit' : 'full'));
    }
  }
  document.addEventListener('fullscreenchange', texts); document.addEventListener('webkitfullscreenchange', texts);
  window.wnbOnLang(texts);
})();
</script>

<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
  const load = document.getElementById('wnb-load');
  const bar = document.getElementById('wnb-bar');
  const msg = document.getElementById('wnb-msg');
  const errBox = document.getElementById('wnb-err');
  msg.textContent = wnbT('load');
  function fail(err) {
    console.error(err);
    errBox.textContent = (err && err.message) ? err.message : String(err || 'An unknown error occurred.');
    errBox.style.display = 'block';
    msg.textContent = wnbT('fail');
  }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('Your browser is missing features the game needs:\n' + missing.join('\n'));
    return;
  }
  engine.startGame({
    onProgress: function (cur, total) {
      if (cur > 0 && total > 0) {
        bar.max = total; bar.value = cur;
        msg.textContent = wnbT('load') + ' ' + (cur / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
      } else {
        bar.removeAttribute('value');
      }
    },
  }).then(function () {
    window.wnbTimes.started = performance.now();
    bar.max = 1; bar.value = 1;
    msg.textContent = wnbT('start');
    // заставка гаснет, когда игра нарисовала титул (или через 4 с — что раньше)
    const t0 = performance.now();
    (function wait() {
      if (window.wnbTimes.title || performance.now() - t0 > 4000) {
        load.style.opacity = '0';
        setTimeout(function () { load.remove(); }, 700);
        return;
      }
      setTimeout(wait, 100);
    })();
  }, fail);
}());
</script>
