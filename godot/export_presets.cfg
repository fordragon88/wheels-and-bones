; Пресет экспорта «Колёса и Кости» (Godot 4.7.2). Браузерную сборку делает tools/build_web.py: он копирует проект
; в build/web_stage/ (картинки ужаты, музыки и кадров в пакете нет — они лежат файлами рядом с игрой) и экспортирует
; ОТТУДА этим же пресетом. Экспорт прямо из редактора даст тяжёлый пакет без музыки — так не выкладывать.
; Однопоточный (variant/thread_support=false): GitHub Pages не отдаёт заголовки COOP/COEP; рендер — Compatibility
; (project.godot). Звук в браузере — режим Sample (по умолчанию в 4.3+), музыка — элемент <audio> страницы (Audio).

